<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema JMC</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="loginPage" class="login-page"><div class="login-box"><div class="login-logo">JMC INDUSTRIAL</div><p class="muted">Sistema de Gestão</p><form id="login"><label>Usuário</label><input class="input" id="username" autocomplete="username" required><label>Senha</label><input class="input" id="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Entrar</button><div id="loginError" class="error"></div></form></div></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand">JMC INDUSTRIAL</div><nav class="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="users">Usuários</button><button data-page="clientes">Clientes</button><button data-page="produtos">Produtos / Estoque</button><button data-page="vendas">Vendas</button><button data-page="entregas">Entregas</button><button data-page="financeiro">Financeiro</button></nav></aside><section class="main"><header class="topbar"><strong id="pageName">Dashboard</strong><div class="user"><span id="userName">Usuário</span><span id="userRole" class="muted">Perfil</span><div class="avatar" id="avatar">J</div><button class="btn danger" id="logout">Sair</button></div></header><main class="content"><h1 class="page-title" id="title">Dashboard</h1><p class="muted" id="subtitle">Visão geral do Sistema JMC</p><div id="pageContent"></div></main></section></div><script src="app.js"></script>
</body></html>
